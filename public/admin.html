<!DOCTYPE html>

<html>

<head>

    <title>Tapr Admin</title>

    <style>
        body {

            font-family: Arial, sans-serif;

            padding: 40px;

        }

        .card {

            border: 1px solid #ddd;

            padding: 20px;

            margin-bottom: 16px;

            border-radius: 8px;

        }

        .value {

            font-size: 32px;

            font-weight: bold;

        }
    </style>

</head>

<body>

    <h1>Tapr Admin Dashboard</h1>

    <div class="card">
        <div>Active Merchants</div>
        <div id="active" class="value">-</div>
    </div>

    <div class="card">
        <div>Trial Merchants</div>
        <div id="trial" class="value">-</div>
    </div>

    <div class="card">
        <div>Total Customers</div>
        <div id="customers" class="value">-</div>
    </div>

    <div class="card">
        <div>Webhook Events</div>
        <div id="webhooks" class="value">-</div>
    </div>

    <div class="card">
        <div>Wallet Sync Logs</div>
        <div id="walletSyncs" class="value">-</div>
    </div>

    <div class="card">
        <div>Error Logs</div>
        <div id="errors" class="value">-</div>
    </div>

    <div class="card">

        <h3>Recent Webhooks</h3>

        <div id="recentWebhooks">
            Loading...
        </div>
    </div>

    <script>

        async function loadStats() {

            const res =

                await fetch(

                    '/admin/stats'

                );

            const data =
                await res.json();

            document.getElementById(
                'active'
            ).textContent =
                data.active;

            document.getElementById(
                'trial'
            ).textContent =
                data.trial;

            document.getElementById(
                'customers'
            ).textContent =
                data.customers;

            document.getElementById(
                'webhooks'
            ).textContent =
                data.webhooks;

            document.getElementById(
                'walletSyncs'
            ).textContent =
                data.walletSyncs;

            document.getElementById(
                'errors'
            ).textContent =
                data.errors;

        }

        async function loadRecentWebhooks() {

            const res =
                await fetch(
                    '/admin/recent-webhooks'
                );

            const rows =
                await res.json();

            const container =
                document.getElementById(
                    'recentWebhooks'
                );

            container.innerHTML = '';

            rows.forEach(row => {

                const div =
                    document.createElement('div');

                div.style.marginBottom =
                    '12px';

                div.innerHTML = `
            <strong>
                ${row.event_type}
            </strong>
            <br>
            ${row.merchants?.name || 'Unknown'}
            <br>
            <small>
                ${new Date(
                    row.created_at
                ).toLocaleString()}
            </small>
        `;

                container.appendChild(div);

            });

        }

        loadStats();
        loadRecentWebhooks();

    </script>

</body>

</html>
